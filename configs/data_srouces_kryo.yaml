    end: 2024-12-31
    freq: 1YS
  variables:
    time: time
    lat: lat
    lon: lon
    uwnd: u10
    vwnd: v10
  processors:
    - sort_lat
    - lon_180
    - compute_wind_moments
    - resample_to_monthly
    - ncep_interp
  

atm_co2:
