[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
"Homepage" = "https://seaflux.readthedocs.io/en/latest/"
"GitHub" = "https://github.com/CryoGrid"

[project]
name = "pyseaflux"
version = "3.0.1"
description = "A companion package to the SeaFlux air sea CO2 flux ensemble for observation-based data products that estimate pCO2. "
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
maintainers = [
    # please add your name here if you contribute to the project
    { name = "Luke Gregor", email = "lukegre@gmail.com" },
    { name = "Amanda Fay", email = "afay@ldeo.columbia.edu" },
]

requires-python = ">=3.9"
classifiers = [  # see https://pypi.org/classifiers/
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Oceanography",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]


dependencies = [
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "matplotlib>=3.9.4",
    "munch>=4.0.0",
    "netcdf4>=1.7.2",
    "pooch>=1.8.2",
    "pyyaml>=6.0.2",
    "schema>=0.7.7",
    "voluptuous>=0.15.2",
    "xarray>=2024.7.0",
    "zarr<3", # some issues with Zarr 3 as it's still really new
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
data = [
    "aiohttp>=3.11.14",
    "bottleneck>=1.4.2",
    "dask>=2024.8.0",
    "fsspec>=2025.3.0",
    "gcsfs>=2025.3.0",
    "h5netcdf>=1.6.1",
    "munch>=4.0.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "scipy>=1.13.1",
]

[tool.hatch.build]
packages = ["src/pyseaflux"]
